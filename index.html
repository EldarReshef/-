    <title>מחשבון ביטוח חיים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Heebo', sans-serif;
        background-color: #f3f4f6;
      }
      /* Utility for LTR numbers/text within RTL context */
      .dir-ltr {
        direction: ltr;
        unicode-bidi: embed;
      }
      
      /* Hide elements during PDF export if needed */
      .hide-on-print {
        display: block;
      }

      /* PDF Export Specific Styles - Force Light Mode Look */
      .pdf-mode {
        background-color: #ffffff !important;
        color: #000000 !important;
        /* Arial is used to prevent punctuation flipping issues in html2canvas */
        font-family: Arial, Helvetica, sans-serif !important;
      }
      .pdf-mode * {
        font-family: Arial, Helvetica, sans-serif !important;
        color: #000000 !important;
        border-color: #e5e7eb !important;
      }
      /* Ensure background colors print nicely (force light backgrounds) */
      .pdf-mode .bg-gray-50, .pdf-mode .dark\:bg-gray-800, .pdf-mode .dark\:bg-gray-900 { background-color: #f9fafb !important; }
      .pdf-mode .bg-white, .pdf-mode .dark\:bg-gray-700 { background-color: #ffffff !important; }
      
      /* Flatten shadows for cleaner print */
      .pdf-mode .shadow-md, 
      .pdf-mode .shadow-sm {
        box-shadow: none !important;
        border: 1px solid #e5e7eb !important;
      }
    </style>
